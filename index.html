<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Settlement Action Checker</title>
  <style>
    :root {
      --bg: #0d0d0d;
      --surface: #1a1a1a;
      --surface-muted: #141414;
      --border: #2a2a2a;
      --text-primary: #e5e5e5;
      --text-secondary: #a0a0a0;
      --text-tertiary: #737373;
      --accent: #6366f1;
      --positive: #22c55e;
      --danger: #ef4444;
      --warning: #f59e0b;
      --font-sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    * { box-sizing: border-box; }
    body {
      font-family: var(--font-sans);
      background: var(--bg);
      color: var(--text-primary);
      margin: 0;
      padding: 24px 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 560px;
      margin: 0 auto;
    }
    .subtitle {
      font-size: 14px;
      color: var(--text-tertiary);
      margin-bottom: 24px;
      line-height: 1.5;
    }
    .field-row {
      display: flex;
      gap: 12px;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }
    .field {
      flex: 1;
      min-width: 140px;
    }
    .field-label {
      font-size: 11px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 8px;
      text-transform: uppercase;
      letter-spacing: 0.4px;
    }
    select {
      width: 100%;
      padding: 12px 14px;
      font-size: 14px;
      font-family: var(--font-sans);
      color: var(--text-primary);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      outline: none;
      cursor: pointer;
      appearance: none;
      background-image: url("data:image/svg+xml,%3Csvg width='12' height='8' viewBox='0 0 12 8' fill='none' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M1 1.5L6 6.5L11 1.5' stroke='%23737373' stroke-width='1.5' stroke-linecap='round' stroke-linejoin='round'/%3E%3C/svg%3E");
      background-repeat: no-repeat;
      background-position: right 14px center;
      padding-right: 36px;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    select:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
    }
    select:disabled {
      opacity: 0.4;
      cursor: not-allowed;
      background-color: var(--surface-muted);
    }
    .results {
      border: 1px solid var(--border);
      border-radius: 14px;
      overflow: hidden;
      background: var(--surface);
    }
    .results-header {
      padding: 14px 18px;
      background: var(--surface-muted);
      font-size: 13px;
      font-weight: 600;
      color: var(--text-secondary);
      border-bottom: 1px solid var(--border);
    }
    .action-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 18px;
      border-bottom: 1px solid var(--border);
    }
    .action-row:last-child { border-bottom: none; }
    .action-name {
      font-size: 15px;
      font-weight: 500;
      color: var(--text-primary);
    }
    .action-name-green {
      color: var(--positive);
    }
    .action-name-red {
      color: var(--danger);
    }
    .action-note {
      font-size: 13px;
      color: var(--text-tertiary);
      margin-top: 3px;
    }
    .empty-state {
      padding: 48px 24px;
      text-align: center;
      color: var(--text-tertiary);
      font-size: 14px;
    }
    .context-note {
      padding: 12px 18px;
      background: rgba(99, 102, 241, 0.06);
      border-bottom: 1px solid var(--border);
      font-size: 13px;
      color: var(--text-secondary);
      line-height: 1.5;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      white-space: nowrap;
    }
    .badge-waiting {
      background: rgba(245, 158, 11, 0.12);
      color: var(--warning);
    }
    .badge-neutral {
      background: rgba(115, 115, 115, 0.12);
      color: var(--text-tertiary);
    }
  </style>
<base target="_blank">
</head>
<body>
  <div class="container">
    <div class="subtitle">Select a settlement's current state to see which actions are available.</div>

    <div class="field-row">
      <div class="field">
        <div class="field-label">Transaction Status</div>
        <select id="txStatus">
          <option value="">Select…</option>
          <option value="Pending">Pending</option>
          <option value="Processing">Processing</option>
          <option value="Success">Success</option>
          <option value="Cancelled">Cancelled</option>
        </select>
      </div>
      <div class="field">
        <div class="field-label">API Status</div>
        <select id="apiStatus" disabled>
          <option value="">Select TX status first</option>
        </select>
      </div>
      <div class="field">
        <div class="field-label">Settlement Type</div>
        <select id="settlementType">
          <option value="Same Currency">Same Currency</option>
          <option value="International">International</option>
        </select>
      </div>
    </div>

    <div id="results" class="results"></div>
  </div>

  <script>
    function getValidApiStatuses(tx, type) {
      if (tx === 'Pending') return ['No API Status'];
      if (tx === 'Processing') {
        if (type === 'International') return ['No API Status'];
        return ['No API Status', 'API Processing', 'API Failed', 'Name Mismatch', 'Non Definitive'];
      }
      if (tx === 'Success') {
        if (type === 'International') return ['No API Status'];
        return ['No API Status', 'API Failed', 'Name Mismatch'];
      }
      if (tx === 'Cancelled') return ['No API Status', 'API Failed', 'Name Mismatch'];
      return [];
    }

    function getValidSettlementTypes(tx, api) {
      if (tx === 'Processing' && (api === 'API Processing' || api === 'API Failed' || api === 'Name Mismatch' || api === 'Non Definitive')) {
        return ['Same Currency'];
      }
      return ['Same Currency', 'International'];
    }

    const rules = {
      'Pending': {
        'No API Status': { actions: { approve: true, cancel: true }, note: '' },
      },
      'Processing': {
        'No API Status':      { actions: { cancel: true, submitApi: true, markSuccess: true }, note: '' },
        'API Processing':     { actions: {}, note: 'Awaiting gateway response. No actions available until the gateway completes processing.', waiting: true },
        'API Failed':         { actions: { cancel: true, submitApi: true, markSuccess: true }, note: '' },
        'Name Mismatch':      { actions: { cancel: true, submitApi: true, markSuccess: true }, note: '' },
        'Non Definitive':     { actions: {}, note: 'Gateway response was inconclusive. No actions available until the gateway provides a definitive result.', waiting: true },
      },
      'Success': {
        'No API Status':      { actions: { uploadProof: true }, note: '' },
        'API Failed':         { actions: {}, note: 'Settlement is complete. No further actions available.' },
        'Name Mismatch':      { actions: {}, note: 'Settlement is complete. No further actions available.' },
      },
      'Cancelled': {
        'No API Status':      { actions: {}, note: 'Settlement has been cancelled. No further actions available.' },
        'API Failed':         { actions: {}, note: 'Settlement has been cancelled. No further actions available.' },
        'Name Mismatch':      { actions: {}, note: 'Settlement has been cancelled. No further actions available.' },
      },
    };

    const canonicalOrder = ['approve', 'submitApi', 'markSuccess', 'cancel', 'uploadProof'];

    const actionDefs = {
      approve:      { name: 'Approve', desc: 'Moves settlement to Processing', colorClass: '' },
      submitApi:    { name: 'Submit API', desc: 'Submit payout to gateway', colorClass: '' },
      markSuccess:  { name: 'Mark as Success', desc: 'Complete without gateway API', colorClass: 'action-name-green' },
      cancel:       { name: 'Cancel', desc: 'Permanently stops the settlement', colorClass: 'action-name-red' },
      uploadProof:  { name: 'Upload Payment Proof', desc: 'Attach confirmation files', colorClass: '' },
    };

    const txSelect = document.getElementById('txStatus');
    const apiSelect = document.getElementById('apiStatus');
    const typeSelect = document.getElementById('settlementType');
    const results = document.getElementById('results');

    function updateApiOptions() {
      const tx = txSelect.value;
      const type = typeSelect.value;
      const currentApi = apiSelect.value;

      if (!tx) {
        apiSelect.innerHTML = '<option value="">Select TX status first</option>';
        apiSelect.disabled = true;
        return;
      }

      const options = getValidApiStatuses(tx, type);
      let html = '<option value="">Select API status…</option>';
      for (const opt of options) {
        html += `<option value="${opt}">${opt}</option>`;
      }
      apiSelect.innerHTML = html;
      apiSelect.disabled = false;

      if (options.includes(currentApi)) {
        apiSelect.value = currentApi;
      } else {
        apiSelect.value = '';
      }
    }

    function updateTypeOptions() {
      const tx = txSelect.value;
      const api = apiSelect.value;
      const currentType = typeSelect.value;

      if (!tx || !api) return;

      const options = getValidSettlementTypes(tx, api);
      let html = '';
      for (const opt of options) {
        html += `<option value="${opt}">${opt}</option>`;
      }
      typeSelect.innerHTML = html;

      if (options.includes(currentType)) {
        typeSelect.value = currentType;
      } else {
        typeSelect.value = options[0];
      }
    }

    function render() {
      const tx = txSelect.value;
      const api = apiSelect.value;
      const type = typeSelect.value;

      if (!tx || !api) {
        results.innerHTML = '<div class="empty-state">Select Transaction Status and API Status to see available actions.</div>';
        return;
      }

      const rule = rules[tx]?.[api];
      if (!rule) {
        results.innerHTML = '<div class="empty-state">Invalid state combination.</div>';
        return;
      }

      let html = '';

      if (rule.note) {
        html += `<div class="context-note">${rule.note}</div>`;
      }

      const available = [];
      for (const key of canonicalOrder) {
        if (!rule.actions[key]) continue;
        if (key === 'submitApi' && type === 'International') continue;
        if (key === 'uploadProof' && type === 'Same Currency') continue;
        if (key === 'uploadProof' && !(tx === 'Success' && api === 'No API Status')) continue;
        available.push(key);
      }

      if (available.length === 0) {
        const badgeClass = rule.waiting ? 'badge-waiting' : 'badge-neutral';
        const badgeText = rule.waiting ? 'Awaiting' : 'None';
        html += '<div class="results-header">Available Actions</div>';
        html += `<div class="action-row"><div><div class="action-name">No actions available</div><div class="action-note">${rule.note || 'This settlement is in a terminal state.'}</div></div><span class="badge ${badgeClass}">${badgeText}</span></div>`;
      } else {
        html += '<div class="results-header">Available Actions</div>';
        for (const key of available) {
          const def = actionDefs[key];
          const colorClass = def.colorClass ? ` ${def.colorClass}` : '';
          html += `
            <div class="action-row">
              <div>
                <div class="action-name${colorClass}">${def.name}</div>
                <div class="action-note">${def.desc}</div>
              </div>
            </div>
          `;
        }
      }

      results.innerHTML = html;
    }

    txSelect.addEventListener('change', () => { updateApiOptions(); updateTypeOptions(); render(); });
    apiSelect.addEventListener('change', () => { updateTypeOptions(); render(); });
    typeSelect.addEventListener('change', () => { updateApiOptions(); render(); });

    updateApiOptions();
    render();
  </script>
</body>
</html>
